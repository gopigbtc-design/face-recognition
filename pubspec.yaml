name: face_guard
description: On-device face recognition with liveness and anti-spoofing (Android).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ">=0.11.1 <0.13.0"
  google_mlkit_face_detection: ">=0.13.1 <2.0.0"
  tflite_flutter: ^0.12.1
  sqflite: ^2.4.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/MobileFaceNet.tflite
    - assets/models/FaceAntiSpoofing.tflite
