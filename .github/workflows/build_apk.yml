name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # lets you start a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 21: current Android Gradle Plugin lint uses Java 21 APIs
      # (List.removeLast) and crashes with NoSuchMethodError on Java 17.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Point Flutter at Java 21
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Flutter version
        run: |
          flutter --version
          java -version

      # Generates the Android Gradle scaffolding; existing files
      # (lib/, AndroidManifest.xml, proguard-rules.pro, tests) are kept.
      - name: Generate platform files
        run: flutter create --org com.faceguard --project-name face_guard --platforms android .

      # tflite_flutter compiles Java for 11 while Kotlin defaults to 17; the plugin
      # has no Kotlin sources, so downgrade the JVM-target check to a warning.
      - name: Relax Kotlin JVM-target check
        run: |
          grep -q "kotlin.jvm.target.validation.mode" android/gradle.properties || \
            printf '\nkotlin.jvm.target.validation.mode=warning\n' >> android/gradle.properties
          cat android/gradle.properties

      - name: Get packages
        run: flutter pub get

      - name: Analyze (fails only on errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: face-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
